<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QA harness — tracking del checkup</title>
<style>html,body{margin:0;background:#111}iframe{width:100%;height:100vh;border:0;display:block}</style>
</head>
<body>
<iframe id="ck" src="./checkup.html"></iframe>
<script>
/* Arnés temporal de QA. Mismo origen que checkup.html, así que desde aquí
   se puede manejar el DOM del iframe y a la vez escuchar sus postMessage. */
window.__ck = [];
window.addEventListener('message', function(e){
  if (!e.data || typeof e.data !== 'object' || e.data.source !== 'bosco-marketing-checkup') return;
  window.__ck.push({ event: e.data.event, id: e.data.eventId, data: e.data.eventData });
});
window.__doc = function(){ return document.getElementById('ck').contentDocument; };
</script>
</body>
</html>
